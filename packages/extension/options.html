<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arc SidePanel API Patcher</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header>
      <h1>Arc SidePanel API Patcher</h1>
      <p class="subtitle">Patches installed extensions that rely on <code>chrome.sidePanel</code>, which Arc doesn't implement.</p>
      <p id="status" class="status">Connecting to native host&hellip;</p>
    </header>

    <main>
      <section id="needs-patch-section">
        <h2>Uses chrome.sidePanel</h2>
        <ul id="needs-patch-list" class="extension-list"></ul>
        <p id="needs-patch-empty" class="empty-state" hidden>None of your installed extensions use chrome.sidePanel.</p>
      </section>

      <details id="other-section">
        <summary>Other installed extensions</summary>
        <ul id="other-list" class="extension-list"></ul>
      </details>
    </main>

    <template id="extension-row-template">
      <li class="extension-row">
        <img class="extension-icon" alt="" />
        <div class="extension-info">
          <div class="extension-name"></div>
          <div class="extension-version"></div>
        </div>
        <div class="extension-actions">
          <label class="panel-mode">
            Panel style
            <select class="panel-mode-select">
              <option value="overlay" selected>Overlay &mdash; docked panel on the page</option>
              <option value="split-tab">Split tab &mdash; own tab, for Arc split view</option>
            </select>
          </label>
          <button class="patch-button">Patch</button>
          <div class="patch-result" hidden>
            <p class="patch-result-text"></p>
            <button class="reveal-button">Reveal in Finder</button>
            <ol class="next-steps">
              <li>Open <code>arc://extensions</code> and enable Developer Mode</li>
              <li>Click "Load Unpacked" and select the revealed folder</li>
              <li>Disable the original (unpatched) extension to avoid duplicates</li>
              <li class="split-tab-step" hidden>Open the panel once, then drag its tab into a split &mdash; Arc remembers the layout per space</li>
            </ol>
          </div>
          <p class="patch-error" hidden></p>
        </div>
      </li>
    </template>

    <script src="options.js"></script>
  </body>
</html>
